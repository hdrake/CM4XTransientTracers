name: CM4XTransientTracers
channels:
  - conda-forge
dependencies:
  - python==3.11
  - netcdf4
  - pandas
  - xarray
  - xgcm >= 0.9.0
  - zarr
  - cftime
  - scipy
  - dask
  - bottleneck
  - intake-esm
  - jupyterlab
  - matplotlib
  - cmocean
  - cartopy
  - pip
  - pip:
    - xbudget >= 0.5.0
    - git+https://github.com/hdrake/doralite.git@master
    - git+https://github.com/hdrake/gfdl_utils.git@master
    - git+https://github.com/hdrake/CM4Xutils.git@main
